# QR Generator 서비스 전용 설정
spring:
  application:
    name: qr-gen

  # 공통 저장소는 grap_cms 를 사용한다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/grap_cms?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root

# MyBatis 설정
mybatis:
  mapper-locations: classpath:/mapper/qrgen/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# PageHelper 설정
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# QR Generator 전용 데이터소스는 레거시 qr_gen DB 를 유지한다.
qrgen:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qr_gen?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: jursi
    password: Qnflck2##$

  qr-image:
    save-path: ${user.dir}/uploads/qrgen/images
  qr-code:
    default-size: 300
    max-size: 1000
    min-size: 100
