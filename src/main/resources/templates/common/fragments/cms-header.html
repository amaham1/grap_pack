<!-- 관리자 헤더 (Grap CMS) -->
<aside th:fragment="admin-header"
       class="admin-sidebar"
       th:with="requestUri=${currentPath != null ? currentPath : ''}">
    <a class="admin-brand" th:href="@{/admin/dashboard}">
        <span class="admin-brand-mark">G</span>
        <span>
            <span class="admin-brand-title">Grap CMS</span>
            <span class="admin-brand-subtitle">관리 콘솔</span>
        </span>
    </a>

    <nav class="admin-nav" aria-label="Grap CMS 관리자 메뉴">
        <div class="admin-nav-group">
            <p class="admin-nav-title">콘텐츠</p>
            <a th:href="@{/admin/content/articles}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/admin/content/articles')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                콘텐츠 관리
            </a>
            <a th:href="@{/admin/content/types}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/admin/content/types')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                콘텐츠 타입
            </a>
            <a th:href="@{/admin/content/datasets/festivals}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/admin/content/datasets')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                외부 데이터셋
            </a>
        </div>

        <div class="admin-nav-group">
            <p class="admin-nav-title">데이터 동기화</p>
            <a th:href="@{/grap/admin/sync}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/grap/admin/sync')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                API 동기화
            </a>
            <a th:href="@{/admin/content/sync-jobs}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/admin/content/sync-jobs')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                동기화 작업
            </a>
        </div>

        <div class="admin-nav-group">
            <p class="admin-nav-title">외부 콘텐츠 검수</p>
            <a th:href="@{/grap/admin/external/festivals}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/grap/admin/external/festivals')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                축제/행사
            </a>
            <a th:href="@{/grap/admin/external/exhibitions}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/grap/admin/external/exhibitions')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                공연/전시
            </a>
            <a th:href="@{/grap/admin/external/welfare}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/grap/admin/external/welfare')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                복지서비스
            </a>
            <a th:href="@{/grap/admin/external/gas-stations}"
               class="admin-nav-link"
               th:classappend="${#strings.startsWith(requestUri, '/grap/admin/external/gas-stations')} ? ' active'">
                <span class="admin-nav-indicator"></span>
                주유소
            </a>
        </div>
    </nav>

    <div class="admin-sidebar-footer">
        <form th:action="@{/grap/auth/logout}" method="post">
            <button type="submit" class="admin-logout-button">로그아웃</button>
        </form>
    </div>
</aside>

<!-- 사용자 공통 헤더 -->
<header
        th:fragment="user-header"
        class="site-header"
        th:with="
            requestUri=${currentPath != null ? currentPath : ''},
            isRealEstate=${#strings.startsWith(requestUri, '/grap/user/content/real-estate')},
            isQrGen=${#strings.startsWith(requestUri, '/qrgen')},
            isQrHistory=${#strings.startsWith(requestUri, '/qrgen/user/history')},
            isQrLogin=${#strings.startsWith(requestUri, '/qrgen/auth/login')},
            isQrRegister=${#strings.startsWith(requestUri, '/qrgen/auth/register')}
        ">
    <div class="site-header-inner">
        <div class="site-header-primary">
            <a th:href="@{/grap/user/content/real-estate}" class="site-brand">Grap</a>

            <nav class="site-primary-nav" aria-label="주요 서비스">
                <a
                        th:href="@{/grap/user/content/real-estate}"
                        class="site-nav-link"
                        th:classappend="${isRealEstate} ? ' is-active'">
                    제주도 부동산
                </a>
                <a
                        th:href="@{/qrgen/}"
                        class="site-nav-link"
                        th:classappend="${isQrGen} ? ' is-active'">
                    QR코드 생성
                </a>
            </nav>
        </div>

        <nav class="site-secondary-nav" aria-label="QR 계정 메뉴" th:if="${isQrGen}">
            <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                <a
                        th:href="@{/qrgen/user/history}"
                        class="site-nav-link site-nav-link-secondary"
                        th:classappend="${isQrHistory} ? ' is-active'">
                    내 생성기록
                </a>
                <form th:action="@{/qrgen/auth/logout}" method="post" class="site-inline-form">
                    <button type="submit" class="site-nav-button">로그아웃</button>
                </form>
            </th:block>

            <th:block th:unless="${#authorization.expression('isAuthenticated()')}">
                <a
                        th:href="@{/qrgen/auth/login}"
                        class="site-nav-link site-nav-link-secondary"
                        th:classappend="${isQrLogin} ? ' is-active'">
                    로그인
                </a>
                <a
                        th:href="@{/qrgen/auth/register}"
                        class="site-nav-link site-nav-link-accent"
                        th:classappend="${isQrRegister} ? ' is-active'">
                    회원가입
                </a>
            </th:block>
        </nav>
    </div>
</header>
