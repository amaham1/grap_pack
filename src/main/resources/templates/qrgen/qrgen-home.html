<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{qrgen/layout/qrgen-layout}">
<head>
    <title>무료 QR 코드 생성기</title>
</head>
<body>
<div layout:fragment="content">
    <div class="qrgen-container">
        <h1 class="qrgen-title">무료 QR 코드 생성기</h1>

        <div class="qrgen-generator">
            <!-- 생성 폼 -->
            <div class="qrgen-form-section">
                <form id="qrgen-form" class="qrgen-form">
                    <div class="qrgen-form-group">
                        <label for="contentType">유형</label>
                        <select id="contentType" name="contentType" required>
                            <option th:each="type : ${contentTypes}"
                                    th:value="${type.name()}"
                                    th:text="${type.description}"
                                    th:selected="${history != null && history.qrGenHistoryContentType == type.name()}">
                            </option>
                        </select>
                    </div>

                    <!-- 조합된 값을 API에 전달하는 hidden input -->
                    <input type="hidden" id="contentValue" name="contentValue">
                    <!-- 히스토리 복원용 hidden input -->
                    <input type="hidden" id="historyContentType" th:value="${history?.qrGenHistoryContentType}" />
                    <input type="hidden" id="historyContentValue" th:value="${history?.qrGenHistoryContentValue}" />

                    <!-- URL 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-URL">
                        <div class="qrgen-form-group">
                            <label for="qrgen-url">URL</label>
                            <input type="text" id="qrgen-url" placeholder="https://example.com" required>
                        </div>
                    </div>

                    <!-- TEXT 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-TEXT">
                        <div class="qrgen-form-group">
                            <label for="qrgen-text">텍스트</label>
                            <textarea id="qrgen-text" rows="4" placeholder="원하는 텍스트를 입력하세요" required></textarea>
                        </div>
                    </div>

                    <!-- EMAIL 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-EMAIL">
                        <div class="qrgen-form-group">
                            <label for="qrgen-email-addr">이메일 주소</label>
                            <input type="email" id="qrgen-email-addr" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <!-- PHONE 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-PHONE">
                        <div class="qrgen-form-group">
                            <label for="qrgen-phone">전화번호</label>
                            <input type="tel" id="qrgen-phone" placeholder="010-1234-5678" required>
                        </div>
                    </div>

                    <!-- WIFI 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-WIFI">
                        <div class="qrgen-form-group">
                            <label for="qrgen-wifi-ssid">네트워크 이름 (SSID)</label>
                            <input type="text" id="qrgen-wifi-ssid" placeholder="MyWiFi" required>
                        </div>
                        <div class="qrgen-fields-grid">
                            <div class="qrgen-form-group">
                                <label for="qrgen-wifi-password">비밀번호 <span class="qrgen-field-label-optional">(선택)</span></label>
                                <input type="text" id="qrgen-wifi-password" placeholder="비밀번호">
                            </div>
                            <div class="qrgen-form-group">
                                <label for="qrgen-wifi-encryption">암호화 방식</label>
                                <select id="qrgen-wifi-encryption">
                                    <option value="WPA" selected>WPA/WPA2</option>
                                    <option value="WEP">WEP</option>
                                    <option value="nopass">없음</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- GEO 필드 -->
                    <div class="qrgen-dynamic-fields qrgen-fields-GEO">
                        <div class="qrgen-fields-grid">
                            <div class="qrgen-form-group">
                                <label for="qrgen-geo-lat">위도</label>
                                <input type="number" id="qrgen-geo-lat" step="any" placeholder="37.5665" required>
                            </div>
                            <div class="qrgen-form-group">
                                <label for="qrgen-geo-lng">경도</label>
                                <input type="number" id="qrgen-geo-lng" step="any" placeholder="126.9780" required>
                            </div>
                        </div>
                    </div>

                    <div class="qrgen-options">
                        <div class="qrgen-form-group qrgen-form-group-small">
                            <label for="size">크기 (px)</label>
                            <input type="number" id="size" name="size"
                                   th:value="${history?.qrGenHistorySize ?: 300}"
                                   min="100" max="1000" step="50">
                        </div>

                        <div class="qrgen-form-group qrgen-form-group-small">
                            <label for="errorCorrection">에러 보정</label>
                            <select id="errorCorrection" name="errorCorrection">
                                <option value="L" th:selected="${history?.qrGenHistoryErrorCorrection == 'L'}">L (7%)</option>
                                <option value="M" th:selected="${history == null || history.qrGenHistoryErrorCorrection == 'M'}">M (15%)</option>
                                <option value="Q" th:selected="${history?.qrGenHistoryErrorCorrection == 'Q'}">Q (25%)</option>
                                <option value="H" th:selected="${history?.qrGenHistoryErrorCorrection == 'H'}">H (30%)</option>
                            </select>
                        </div>

                        <div class="qrgen-form-group qrgen-form-group-small">
                            <label for="foregroundColor">전경색</label>
                            <input type="color" id="foregroundColor" name="foregroundColor"
                                   th:value="${history?.qrGenHistoryFgColor ?: '#000000'}">
                        </div>

                        <div class="qrgen-form-group qrgen-form-group-small">
                            <label for="backgroundColor">배경색</label>
                            <input type="color" id="backgroundColor" name="backgroundColor"
                                   th:value="${history?.qrGenHistoryBgColor ?: '#FFFFFF'}">
                        </div>
                    </div>

                    <div th:if="${isAuthenticated}" class="qrgen-form-group">
                        <label for="title">제목 (선택)</label>
                        <input type="text" id="title" name="title"
                               placeholder="나중에 찾기 쉽도록 제목을 입력하세요"
                               th:value="${history?.qrGenHistoryTitle}">
                    </div>

                    <div class="qrgen-btn-group">
                        <button type="button" id="generateBtn" class="qrgen-btn qrgen-btn-primary">
                            QR 코드 생성
                        </button>
                        <button type="button" id="downloadBtn" class="qrgen-btn qrgen-btn-secondary" style="display:none;">
                            다운로드
                        </button>
                    </div>
                </form>

                <div class="qrgen-notice" th:if="${isAuthenticated}">
                    <span class="qrgen-notice-icon">&#10003;</span>
                    QR 코드 생성 기록이 자동으로 저장됩니다.
                </div>
                <div class="qrgen-notice qrgen-notice-info" th:unless="${isAuthenticated}">
                    <span class="qrgen-notice-icon">&#9432;</span>
                    <a th:href="@{/qrgen/auth/login}">로그인</a>하면 생성 기록이 저장됩니다.
                </div>
            </div>

            <!-- 미리보기 -->
            <div class="qrgen-preview-section">
                <div class="qrgen-preview-title">미리보기</div>
                <div id="qrgen-preview" class="qrgen-preview">
                    <img id="qrgen-preview-img" style="display: none;" alt="QR 미리보기">
                    <div id="qrgen-preview-placeholder" class="qrgen-preview-placeholder">
                        QR 코드가 여기에 표시됩니다
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="structured-data">
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Grap QR - 무료 QR 코드 생성기",
    "url": "https://grap.co.kr/qrgen/",
    "description": "URL, 텍스트, 연락처, Wi-Fi 등 다양한 QR 코드를 무료로 간편하게 생성하세요.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "All",
    "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
    },
    "inLanguage": "ko"
}
</script>
</th:block>
</body>
</html>
