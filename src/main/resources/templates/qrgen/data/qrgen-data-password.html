<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{qrgen/layout/qrgen-layout}">
<head>
    <title>데이터 열람 인증</title>
</head>
<body>
<div layout:fragment="content">
    <div class="qrgen-auth-container">
        <div class="qrgen-auth-box">
            <h2 class="qrgen-auth-title">데이터 열람</h2>
            <p class="qrgen-data-password-desc">관리자 비밀번호를 입력하세요.</p>

            <div th:if="${errorMessage}" class="qrgen-alert qrgen-alert-error">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/qrgen/data/verify}" method="post" class="qrgen-auth-form">
                <div class="qrgen-form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required
                           placeholder="관리자 비밀번호를 입력하세요" autocomplete="off" autofocus>
                </div>

                <button type="submit" class="qrgen-btn qrgen-btn-primary qrgen-btn-full">
                    확인
                </button>
            </form>

            <div class="qrgen-auth-footer">
                <p><a th:href="@{/qrgen/}">QR 코드 생성기로 돌아가기</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
