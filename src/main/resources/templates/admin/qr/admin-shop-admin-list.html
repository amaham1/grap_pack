<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/admin-layout}">
<body>
<section layout:fragment="content">
    <div class="admin-card">
        <div class="admin-toolbar">
            <form method="get" th:action="@{/admin/qr/shop-admins}" class="admin-toolbar-form">
                <label class="admin-field">
                    <span>상태</span>
                    <select name="status">
                        <option value="">전체</option>
                        <option th:each="item : ${statuses}"
                                th:value="${item.name()}"
                                th:selected="${selectedStatus == item}"
                                th:text="${item.name()}">ACTIVE</option>
                    </select>
                </label>
                <label class="admin-field">
                    <span>검색어</span>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="이름, 이메일, 아이디">
                </label>
                <button type="submit" class="admin-secondary-button">검색</button>
            </form>
            <a th:href="@{/admin/qr/shop-admins/new}" class="admin-primary-button">점주 생성</a>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>연락처</th>
                    <th>상태</th>
                    <th>생성일</th>
                    <th>액션</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${result.items}">
                    <td th:text="${item.id}">1</td>
                    <td>
                        <strong th:text="${item.username}">username</strong>
                        <div><small th:text="${item.email}">email</small></div>
                    </td>
                    <td th:text="${item.name}">이름</td>
                    <td th:text="${item.phone}">010-0000-0000</td>
                    <td><span class="admin-chip" th:text="${item.status}">ACTIVE</span></td>
                    <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-22</td>
                    <td>
                        <a th:href="@{/admin/qr/shop-admins/{id}(id=${item.id})}" class="admin-secondary-button">상세</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(result.items)}">
                    <td colspan="7">조회된 점주 계정이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{admin/fragments/admin-pagination :: pager(${result.pageInfo}, ${result.currentPage}, ${result.totalPages}, '/admin/qr/shop-admins')}"></div>
    </div>
</section>
</body>
</html>
