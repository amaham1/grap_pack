<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 운영자 로그인</title>
    <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="admin-login-body">
<div class="admin-login-shell">
    <section class="admin-login-card">
        <p class="admin-login-kicker">Greenfield Admin</p>
        <h1>Grap Pack 통합 운영 포털</h1>
        <p class="admin-login-description">
            Grap, QR Manage, QRgen, 방문자 통계를 하나의 운영 콘솔에서 관리합니다.
        </p>

        <div th:if="${errorMessage}" class="admin-flash admin-flash-error" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="admin-flash admin-flash-success" th:text="${logoutMessage}"></div>

        <form th:action="@{/admin/login}" method="post" class="admin-login-form">
            <label class="admin-field">
                <span>로그인 ID</span>
                <input type="text" name="loginId" placeholder="superadmin" autocomplete="username" required>
            </label>
            <label class="admin-field">
                <span>비밀번호</span>
                <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
            </label>
            <button type="submit" class="admin-primary-button">로그인</button>
        </form>

        <div class="admin-login-links">
            <a th:href="@{/grap/}">Grap</a>
            <a th:href="@{/qrgen/}">QRgen</a>
            <a th:href="@{/qr-manage/view/shop/test}">QR Manage View</a>
        </div>
    </section>
</div>
</body>
</html>
