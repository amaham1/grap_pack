<div class="user-page-header">
    <h2>제주 부동산 실거래</h2>
    <p class="text-muted">제주 지역 실거래 데이터를 월별로 검색하고, 상세 시세 흐름과 매수 가능성을 함께 확인하세요.</p>
</div>

<div class="user-search-section real-estate-search-section">
    <form th:action="@{/grap/user/content/real-estate}" method="get" class="user-search-form real-estate-search-form">
        <input type="text"
               name="keyword"
               th:value="${filters['keyword']}"
               placeholder="아파트명, 읍면동, 주소 검색"
               class="user-form-control">

        <select name="dealYearMonth" class="user-form-control real-estate-select">
            <option value="">월 선택</option>
            <option th:each="monthOption : ${availableMonths}"
                    th:value="${monthOption['value']}"
                    th:selected="${monthOption['value'] == filters['dealYearMonth']}"
                    th:text="${monthOption['label']}"></option>
        </select>

        <select name="sort" class="user-form-control real-estate-select">
            <option th:each="sortOption : ${sortOptions}"
                    th:value="${sortOption['value']}"
                    th:selected="${sortOption['value'] == filters['sort']}"
                    th:text="${sortOption['label']}"></option>
        </select>

        <button type="submit" class="user-btn user-btn-primary">검색</button>
    </form>
</div>

<div class="real-estate-summary">
    <span th:if="${hasData}">
        기준월: <strong th:text="${formattedCurrentPropertyMonth}"></strong>
        (<span th:text="${#numbers.formatInteger(totalCount, 0, 'COMMA')}"></span>건)
    </span>
    <span th:unless="${hasData}">
        아직 적재된 부동산 데이터가 없습니다. 관리자 동기화 후 다시 확인해주세요.
    </span>
</div>

<div class="real-estate-card-grid" th:if="${hasData and !#lists.isEmpty(propertyList)}">
    <article th:each="property : ${propertyList}" class="user-content-card real-estate-card">
        <div class="user-card-header">
            <div class="real-estate-badges">
                <span class="user-badge badge-real-estate-location" th:text="${property['sggName'] + ' ' + property['umdName']}"></span>
                <span class="user-badge badge-real-estate-type" th:text="${property['categoryLabel'] + ' · ' + property['transactionLabel']}"></span>
            </div>
        </div>

        <h3>
            <a th:href="@{/grap/user/content/real-estate/{id}(id=${property['id']})}"
               th:text="${property['displayName']}"></a>
        </h3>
        <p class="real-estate-address" th:text="${property['address']}"></p>

        <div class="real-estate-amount-block">
            <span class="real-estate-amount-label" th:text="${property['amountLabel']}"></span>
            <strong class="real-estate-amount-value" th:text="${property['formattedDisplayAmount']}"></strong>
            <p th:if="${property['transactionType'] == 'rent'}" class="real-estate-rent-note">
                월세 <span th:text="${property['formattedMonthlyRent']}"></span>
            </p>
        </div>

        <dl class="real-estate-meta-list">
            <div>
                <dt>계약일</dt>
                <dd th:text="${property['formattedDealDate']}"></dd>
            </div>
            <div>
                <dt>전용면적</dt>
                <dd th:text="${property['formattedAreaLabel']}"></dd>
            </div>
            <div>
                <dt>층수</dt>
                <dd th:text="${property['formattedFloor']}"></dd>
            </div>
            <div>
                <dt>준공연도</dt>
                <dd th:text="${property['formattedBuildYear']}"></dd>
            </div>
        </dl>

        <div class="user-card-footer real-estate-card-footer">
            <a th:href="@{/grap/user/content/real-estate/{id}(id=${property['id']})}" class="user-btn user-btn-primary">
                상세 분석 보기
            </a>
        </div>
    </article>
</div>

<div th:if="${!hasData or #lists.isEmpty(propertyList)}" class="user-empty-message real-estate-empty-message">
    <p th:if="${hasData}">조건에 맞는 실거래 데이터가 없습니다.</p>
    <p th:unless="${hasData}">아직 조회할 부동산 실거래 데이터가 없습니다.</p>
</div>

<div th:if="${totalPages > 0}" class="pagination real-estate-pagination">
    <a th:if="${pageInfo.hasPrevious}"
       th:href="@{/grap/user/content/real-estate(page=${currentPage - 1}, keyword=${filters['keyword']}, dealYearMonth=${filters['dealYearMonth']}, sort=${filters['sort']})}"
       class="btn btn-sm">이전</a>

    <span th:each="page : ${pageInfo.pages}">
        <span th:if="${page.isEllipsis}" class="pagination-ellipsis">...</span>
        <a th:if="${!page.isEllipsis}"
           th:href="@{/grap/user/content/real-estate(page=${page.number}, keyword=${filters['keyword']}, dealYearMonth=${filters['dealYearMonth']}, sort=${filters['sort']})}"
           th:text="${page.number}"
           th:class="|btn btn-sm ${page.isActive ? 'active' : ''}|"></a>
    </span>

    <a th:if="${pageInfo.hasNext}"
       th:href="@{/grap/user/content/real-estate(page=${currentPage + 1}, keyword=${filters['keyword']}, dealYearMonth=${filters['dealYearMonth']}, sort=${filters['sort']})}"
       class="btn btn-sm">다음</a>
</div>

<div class="pagination-info" th:if="${totalPages > 0}">
    전체 <span th:text="${#numbers.formatInteger(totalCount, 0, 'COMMA')}"></span>건
    (<span th:text="${currentPage}"></span> / <span th:text="${totalPages}"></span> 페이지)
</div>
